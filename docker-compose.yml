services:
  # Economics Cross-Domain Knowledge Mapper: FastAPI + vanilla-JS GUI.
  #   GUI -> http://<host>:8310/
  #   API -> http://<host>:8310/api/...
  econ-mapper:
    build: .
    container_name: economics-mapper
    # Run a real init (docker-init/tini) as PID 1 instead of uvicorn. Docker
    # healthchecks and `docker exec` sessions are reparented to the container's
    # PID 1; a Python process does not reap children it never waited for, so
    # without this every such session becomes a permanent zombie. `init: true`
    # reaps them. For a bare `docker run`, pass `--init` instead.
    init: true
    ports:
      # Host 8310: dev server holds 8304 on this machine. The container itself
      # listens on 8304; override with HOST_PORT=xxxx.
      - "${HOST_PORT:-8310}:8304"
    environment:
      # LLM inference is served from Axiom (2x RTX 5080) over LAN.
      # Verified 2026-10-15: :8210 answers on 192.168.1.173 with qwen3.8:27b
      # (+17 others); the tailnet paths (MagicDNS and 100.101.3.115) blackhole
      # TCP, so LAN is primary. Fallback is this host's own gateway, reached
      # via host.docker.internal (see extra_hosts).
      - LLM_BASE_URL=${LLM_BASE_URL:-http://192.168.1.173:8210/v1}
      - LLM_FALLBACK_URL=${LLM_FALLBACK_URL:-http://host.docker.internal:8210/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8:27b}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-qwen3.8:27b}
      - LLM_TIMEOUT_S=${LLM_TIMEOUT_S:-180}
      - LLM_CONNECT_TIMEOUT_S=${LLM_CONNECT_TIMEOUT_S:-5}
      - ECON_SCHEDULER_ENABLED=${ECON_SCHEDULER_ENABLED:-1}
      - ECON_JOB_LEASE_S=${ECON_JOB_LEASE_S:-900}
    volumes:
      - econ_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Liveness, not readiness: no database, no LLM gateway. Probing a
      # dependency here would report the container unhealthy whenever the
      # gateway is down, and a slow probe keeps the check process alive long
      # enough to be reparented to PID 1 (see `init: true` above).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8304/api/health/live')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  econ_data: