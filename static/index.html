<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economics Cross-Domain Mapper</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/standalone/umd/vis-network.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.4/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --bg4:#2a3038; --border:#30363d;
  --text:#f0f6fc; --text2:#8b949e; --text3:#6e7681;
  --accent:#58a6ff; --green:#3fb950; --orange:#d29922; --red:#f85149;
  --purple:#bc8cff; --teal:#56d4dd; --graph-bg:#0a0e14;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
html.light{
  --bg:#f6f8fa; --bg2:#ffffff; --bg3:#eaeef2; --bg4:#dfe4ea; --border:#d0d7de;
  --text:#1f2328; --text2:#656d76; --text3:#8c959f;
  --accent:#0969da; --green:#1a7f37; --orange:#bd561d; --red:#cf222e;
  --purple:#8250df; --teal:#096b7a; --graph-bg:#f0f2f5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:330px 1fr;grid-template-rows:auto 1fr;
  height:100vh;overflow:hidden}
.layout.single{grid-template-columns:1fr}
.header{grid-column:1/-1;padding:12px 20px;background:var(--bg2);
  border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;gap:16px}
.header h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px}
.header h1 i{color:var(--teal)}
.header-right{display:flex;gap:10px;align-items:center}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;display:flex;flex-direction:column}
.main{overflow-y:auto;display:flex;flex-direction:column;min-width:0}

/* ---------- header bits ---------- */
.pill{padding:3px 9px;border-radius:11px;font-size:11px;font-weight:600;
  border:1px solid var(--border);background:var(--bg3);white-space:nowrap}
.pill.ok{color:var(--green);border-color:var(--green)}
.pill.warn{color:var(--orange);border-color:var(--orange)}
.pill.err{color:var(--red);border-color:var(--red)}
.pill.busy{color:var(--accent);border-color:var(--accent)}
#queuePill{cursor:pointer}
#queuePill:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text2);
  border-radius:6px;padding:5px 9px;transition:.12s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- top-level app switcher ---------- */
.app-switch{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);
  border-radius:9px;padding:3px}
.app-btn{background:transparent;border:none;color:var(--text2);
  border-radius:6px;padding:6px 13px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
.app-btn:hover{color:var(--text)}
.app-btn.active{background:var(--bg3);color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--border)}

/* ---------- sidebar ---------- */
.side-section{padding:14px 16px;border-bottom:1px solid var(--border)}
.side-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text3);margin-bottom:10px;display:flex;justify-content:space-between;
  align-items:center}
.side-title button{background:none;border:none;color:var(--accent);font-size:15px;
  line-height:1;padding:0 2px}
.inv-list{display:flex;flex-direction:column;gap:3px}
.inv-item{padding:9px 10px;border-radius:7px;cursor:pointer;border:1px solid transparent;
  transition:.12s}
.inv-item:hover{background:var(--bg3)}
.inv-item.active{background:var(--bg3);border-color:var(--accent)}
.inv-item-title{font-weight:600;font-size:13px;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-item-meta{font-size:11px;color:var(--text3);display:flex;gap:8px;flex-wrap:wrap}
.inv-item-domains{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.empty{color:var(--text3);font-size:12px;padding:12px 0;text-align:center;
  font-style:italic}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;padding:0 16px;background:var(--bg2);
  border-bottom:1px solid var(--border);overflow-x:auto;flex:none}
.tab{padding:11px 15px;font-size:13px;color:var(--text2);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;display:flex;
  align-items:center;gap:7px;transition:.12s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{background:var(--bg4);color:var(--text2);border-radius:9px;
  padding:1px 6px;font-size:10px;font-weight:700}
.tab.active .count{background:var(--accent);color:#fff}
.view{padding:20px;flex:1;min-height:0}
.view.graph-view{display:flex;flex-direction:column;padding:0;position:relative}

/* ---------- controls ---------- */
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:7px 13px;border-radius:7px;font-weight:500;transition:.12s;
  display:inline-flex;align-items:center;gap:7px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);color:#fff}
.btn.danger:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
input[type=text],input[type=number],select,textarea{background:var(--bg);
  border:1px solid var(--border);color:var(--text);padding:8px 10px;
  border-radius:7px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:64px;font-family:inherit}
label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.field{margin-bottom:13px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* ---------- cards ---------- */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:16px;margin-bottom:14px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;
  align-items:center;gap:9px}
.card h3 .sub{font-size:11px;color:var(--text3);font-weight:400}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

.stat{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:14px}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;
  letter-spacing:.05em}
.stat.clickable{cursor:pointer;transition:.12s}
.stat.clickable:hover{border-color:var(--accent)}

.domain-card{border:1px solid var(--border);border-radius:9px;padding:12px;
  background:var(--bg);position:relative;overflow:hidden}
.domain-card.empty-domain{border-style:dashed;opacity:.78}
.domain-bar{height:4px;border-radius:2px;margin-top:9px;background:var(--bg3);
  overflow:hidden}
.domain-bar i{display:block;height:100%;border-radius:2px}
.domain-name{font-weight:600;font-size:12px;display:flex;align-items:center;gap:7px}
.domain-role{font-size:10px;color:var(--text3);text-transform:uppercase;
  letter-spacing:.05em;margin-top:2px}
.domain-top{font-size:11px;color:var(--text2);margin-top:8px;line-height:1.5;
  display:flex;flex-direction:column;gap:4px}
.domain-top a{color:var(--text2);text-decoration:none;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:flex;gap:5px;align-items:center}
.domain-top a:hover{color:var(--accent)}

/* ---------- artifact / review ---------- */
.group{border:1px solid var(--border);border-radius:9px;margin-bottom:9px;
  overflow:hidden;background:var(--bg2)}
.group-head{padding:10px 14px;display:flex;align-items:center;gap:10px;
  cursor:pointer;user-select:none;background:var(--bg3)}
.group-head:hover{background:var(--bg4)}
.group-head .caret{transition:transform .15s;color:var(--text3);font-size:11px}
.group.collapsed .caret{transform:rotate(-90deg)}
.group.collapsed .group-body{display:none}
.group-body{padding:11px;display:flex;flex-direction:column;gap:9px}
.artifact{border:1px solid var(--border);border-radius:9px;padding:12px;
  background:var(--bg);transition:.12s}
.artifact:hover{border-color:var(--text3)}
.artifact.rejected{opacity:.55}
.artifact.drift{border-left:3px solid var(--orange)}
.art-head{display:flex;justify-content:space-between;gap:12px;
  align-items:flex-start;margin-bottom:7px}
.art-title{font-weight:600;font-size:13px;line-height:1.4}
.art-desc{color:var(--text2);font-size:12px;line-height:1.6;margin-bottom:9px}
.art-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11px;
  color:var(--text3);margin-bottom:9px}
.art-actions{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:2px 7px;border-radius:5px;background:var(--bg3);color:var(--text2);
  font-size:10px;font-weight:600;border:1px solid var(--border)}
.tag.dom{border-color:transparent;color:#06111f}
.tag.up{color:var(--green);border-color:var(--green)}
.tag.down{color:var(--red);border-color:var(--red)}
.tag.flat{color:var(--text3)}
.relevance-ring{width:34px;height:34px;border-radius:50%;flex:none;
  display:grid;place-items:center;font-size:10px;font-weight:700;
  border:2px solid var(--accent);color:var(--accent)}

/* ---------- graph ---------- */
#graph{flex:1;min-height:0;background:var(--graph-bg);border-radius:0}
#briefGraph{height:420px;background:var(--graph-bg);border:1px solid var(--border);
  border-radius:9px}
#importsGraph{height:420px;background:var(--graph-bg);border:1px solid var(--border);
  border-radius:9px}
#askGraph{height:300px;background:var(--graph-bg);border:1px solid var(--border);
  border-radius:9px;margin-bottom:6px}
.mermaid{display:flex;justify-content:center;margin:14px 0;overflow-x:auto}
.mermaid svg{max-width:100%;height:auto}
.doc-index{display:flex;flex-direction:column;gap:6px}
.doc-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  background:var(--bg);cursor:pointer}
.doc-item:hover{border-color:var(--accent)}
.doc-item.active{border-color:var(--accent);background:var(--bg3)}
mark{background:rgba(88,166,255,.3);color:inherit;border-radius:3px;
  padding:0 2px}
.ask-node{border-left:2px solid var(--border);padding:0 0 4px 14px;
  margin-bottom:12px}
.ask-node.root{border-left-color:var(--accent)}
.ask-q{font-weight:600;font-size:13.5px;line-height:1.5;margin-bottom:8px}
.chat-row{margin-bottom:12px}
.chat-row.open .chat-bubble.q{border-color:var(--orange)}
.chat-bubble{max-width:82%;padding:9px 13px;border-radius:13px;font-size:13px;
  line-height:1.6;white-space:pre-wrap;word-break:break-word}
.chat-bubble.q{background:var(--accent);color:#fff;margin-left:auto;
  border-bottom-right-radius:4px;width:fit-content}
.chat-bubble.a{background:var(--bg3);border:1px solid var(--border);
  margin-top:7px;border-bottom-left-radius:4px}
.chat-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  margin-top:7px;font-size:11px}
.legend{position:absolute;left:14px;bottom:14px;background:var(--bg2);
  border:1px solid var(--border);border-radius:9px;padding:12px;max-width:250px;
  font-size:11px;z-index:10;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.legend h4{font-size:10px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text3);margin:9px 0 5px}
.legend h4:first-child{margin-top:0}
.legend .row{display:flex;align-items:center;gap:7px;padding:2px 0;
  cursor:pointer;border-radius:4px}
.legend .row:hover{background:var(--bg3)}
.legend .row.off{opacity:.35}
.graph-toolbar{position:absolute;right:14px;top:14px;z-index:10;display:flex;
  gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.hint{position:absolute;left:14px;top:14px;z-index:10;background:var(--bg2);
  border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;
  color:var(--text2);box-shadow:0 4px 16px rgba(0,0,0,.35)}

/* ---------- explainer ---------- */
.answer{font-size:14px;line-height:1.75}
.answer h1,.answer h2,.answer h3{margin:20px 0 10px;line-height:1.35}
.answer h1{font-size:19px}.answer h2{font-size:16px;
  border-bottom:1px solid var(--border);padding-bottom:6px}
.answer h3{font-size:14px}
.answer p{margin-bottom:11px}
.answer ul,.answer ol{margin:0 0 11px 22px}
.answer li{margin-bottom:5px}
.answer code{background:var(--bg3);padding:2px 5px;border-radius:4px;
  font-family:var(--mono);font-size:12px}
.answer pre{background:var(--bg);border:1px solid var(--border);padding:12px;
  border-radius:8px;overflow-x:auto;margin-bottom:11px}
.answer blockquote{border-left:3px solid var(--accent);padding-left:13px;
  margin:0 0 11px;color:var(--text2)}
.answer a{color:var(--accent)}
.cite{background:var(--bg4);border-radius:4px;padding:1px 5px;font-size:11px;
  font-weight:700;color:var(--accent);cursor:pointer;vertical-align:super}
.cite.dropped{color:var(--red);background:rgba(248,81,73,.15);
  text-decoration:line-through;cursor:help}
.meta-strip{display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  font-size:11px;color:var(--text3);padding-bottom:12px;
  border-bottom:1px solid var(--border);margin-bottom:14px}
.conf-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;
  width:78px;display:inline-block;vertical-align:middle}
.conf-bar i{display:block;height:100%}
.sources{display:flex;flex-direction:column;gap:7px}
.source-item{border:1px solid var(--border);border-radius:8px;padding:10px;
  background:var(--bg);font-size:12px}
.source-quote{border-left:3px solid var(--green);padding-left:10px;
  margin-top:6px;font-style:italic;color:var(--text2)}
.source-item.dropped{border-left:3px solid var(--red);opacity:.72}

/* ---------- gaps ---------- */
.gap{border:1px solid var(--border);border-radius:9px;padding:13px;
  background:var(--bg2);margin-bottom:9px}
.gap.priority{border-left:3px solid var(--orange)}
.gap-why{color:var(--text2);font-size:12px;margin:7px 0 10px;line-height:1.6}
.gap-query{font-family:var(--mono);font-size:11px;background:var(--bg);
  border:1px solid var(--border);border-radius:6px;padding:7px;
  color:var(--text2);margin-bottom:10px}

/* ---------- console / timeline ---------- */
.log{font-family:var(--mono);font-size:11.5px;line-height:1.65;max-height:520px;
  overflow-y:auto;background:var(--bg);border:1px solid var(--border);
  border-radius:9px;padding:12px}
.log-line{display:flex;gap:11px;padding:1px 0}
.log-stage{flex:none;width:62px;font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.log-stage.plan{color:var(--accent)}
.log-stage.search{color:var(--teal)}
.log-stage.analyze{color:var(--purple)}
.log-stage.map{color:var(--green)}
.log-stage.summary{color:var(--orange)}
.log-stage.explainer.retrieve,.log-stage.grounding.check{color:var(--accent)}
.log-msg{flex:1;color:var(--text2);word-break:break-word}
.log-line .dim{color:var(--text3)}

.chain{font-family:var(--mono);font-size:11.5px}
.chain-event{border:1px solid var(--border);border-radius:8px;padding:9px 11px;
  margin-bottom:6px;background:var(--bg2)}
.chain-event.flag{border-left:3px solid var(--orange)}
.chain-event.deny{border-left:3px solid var(--red)}
.chain-event .top{display:flex;gap:11px;align-items:center;flex-wrap:wrap;
  margin-bottom:5px}
.chain-event .seq{color:var(--text3);font-weight:700;min-width:34px}
.chain-event .kind{color:var(--accent);font-weight:700}
.chain-event .actor{color:var(--text2)}
.chain-event .hash{color:var(--text3);font-size:10px;margin-left:auto}
.chain-event .data{color:var(--text2);font-size:11px;background:var(--bg);
  padding:6px 8px;border-radius:5px;margin-top:5px;white-space:pre-wrap;
  word-break:break-all}

table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;padding:8px 10px;color:var(--text3);
  border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;font-weight:600}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--border);
  vertical-align:top}
table.tbl tr:hover td{background:var(--bg2)}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(1,4,9,.78);z-index:100;
  display:none;align-items:center;justify-content:center;padding:24px;
  overflow-y:auto}
.modal-back.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:13px;
  max-width:840px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-head h2{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:9px}

.banner{padding:11px 14px;border-radius:9px;margin-bottom:13px;font-size:12.5px;
  display:flex;gap:9px;align-items:flex-start;line-height:1.55}
.banner.warn{background:rgba(210,153,34,.12);border:1px solid var(--orange);
  color:var(--orange)}
.banner.err{background:rgba(248,81,73,.12);border:1px solid var(--red);
  color:var(--red)}
.banner.info{background:rgba(88,166,255,.1);border:1px solid var(--accent);
  color:var(--accent)}
.banner.ok{background:rgba(63,185,80,.12);border:1px solid var(--green);
  color:var(--green)}

.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);
  border:1px solid var(--border);border-radius:9px;padding:12px 17px;
  font-size:13px;z-index:200;box-shadow:0 8px 26px rgba(0,0,0,.45);
  max-width:380px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(120%);opacity:0}}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.ok{border-color:var(--green)}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>
</head>
<body>
<div class="layout">
  <!-- ============ HEADER ============ -->
  <div class="header">
    <h1><i class="fas fa-chart-network"></i> Economics Cross-Domain Mapper</h1>
    <div class="app-switch" id="appSwitch">
      <button class="app-btn active" data-app="mapper" onclick="switchApp('mapper')">
        <i class="fas fa-project-diagram"></i> Mapper</button>
      <button class="app-btn" data-app="brief" onclick="switchApp('brief')">
        <i class="fas fa-briefcase"></i> Executive brief</button>
      <button class="app-btn" data-app="design" onclick="switchApp('design')">
        <i class="fas fa-drafting-compass"></i> Design</button>
      <button class="app-btn" data-app="ask" onclick="switchApp('ask')">
        <i class="fas fa-comments"></i> Ask</button>
      <button class="app-btn" data-app="imports" onclick="switchApp('imports')">
        <i class="fas fa-box-archive"></i> Imports</button>
    </div>
    <div class="header-right">
      <span id="llmPill" class="pill">gateway…</span>
      <span id="queuePill" class="pill" onclick="showQueueModal()" title="Show queued work">queue…</span>
      <span id="integrityPill" class="pill">ledger…</span>
      <button class="icon-btn" id="taxBtn" title="Domain taxonomy">
        <i class="fas fa-diagram-project"></i></button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">
        <i class="fas fa-adjust"></i></button>
    </div>
  </div>

  <!-- ============ SIDEBAR (Mapper only) ============ -->
  <div class="sidebar" id="sidebar">
    <div class="side-section">
      <div class="side-title">
        <span>Investigations</span>
        <span style="display:flex;gap:6px">
          <button onclick="showNewInvestigation()" title="New investigation">
            <i class="fas fa-plus"></i></button>
          <button onclick="toggleHidden()" title="Show hidden" id="hiddenBtn"
                  style="display:none"><i class="fas fa-eye-slash"></i></button>
        </span>
      </div>
      <div class="inv-list" id="invList"></div>
    </div>
    <div class="side-section" id="invActions" style="display:none">
      <div class="side-title">Actions</div>
      <button class="btn primary" style="width:100%;justify-content:center"
              onclick="startRun()"><i class="fas fa-play"></i> Collect</button>
      <div style="height:7px"></div>
      <button class="btn" style="width:100%;justify-content:center"
              onclick="switchView('gaps')"><i class="fas fa-vial"></i> Find open gaps</button>
      <div style="height:7px"></div>
      <button class="btn" style="width:100%;justify-content:center"
              onclick="showSummaryModal()"><i class="fas fa-file-lines"></i> Executive summary</button>
      <div style="height:7px"></div>
      <button class="btn" style="width:100%;justify-content:center"
              onclick="downloadDossier()"><i class="fas fa-file-arrow-down"></i> Full report</button>

      <button class="btn" style="width:100%;justify-content:center"
              onclick="showScheduleModal()"><i class="fas fa-clock"></i> Schedule</button>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="tabs" id="tabs">
      <div class="tab active" data-view="graph" onclick="switchView('graph')">
        <i class="fas fa-project-diagram"></i> Knowledge graph</div>
      <div class="tab" data-view="artifacts" onclick="switchView('artifacts')">
        <i class="fas fa-box-archive"></i> Artifacts</div>
      <div class="tab" data-view="review" onclick="switchView('review')">
        <i class="fas fa-list-check"></i> Review <span class="count" id="pendingCount">0</span></div>
      <div class="tab" data-view="gaps" onclick="switchView('gaps')">
        <i class="fas fa-vial"></i> Research gaps <span class="count" id="gapCount">0</span></div>
      <div class="tab" data-view="explainer" onclick="switchView('explainer')">
        <i class="fas fa-lightbulb"></i> Explainer</div>
      <div class="tab" data-view="assess" onclick="switchView('assess')">
        <i class="fas fa-scale-balanced"></i> Assessment</div>
      <div class="tab" data-view="board" onclick="switchView('board')">
        <i class="fas fa-building-columns"></i> Board</div>
      <div class="tab" data-view="manager" onclick="switchView('manager')">
        <i class="fas fa-diagram-project"></i> Manager</div>

        <i class="fas fa-landmark"></i> Frameworks</div>
      <div class="tab" data-view="agents" onclick="switchView('agents')">
        <i class="fas fa-robot"></i> Agents</div>
      <div class="tab" data-view="summary" onclick="switchView('summary')">
        <i class="fas fa-chart-pie"></i> Summary</div>
      <div class="tab" data-view="console" onclick="switchView('console')">
        <i class="fas fa-terminal"></i> Agent console</div>
      <div class="tab" data-view="timeline" onclick="switchView('timeline')">
        <i class="fas fa-timeline"></i> Timeline</div>
      <div class="tab" data-view="audit" onclick="switchView('audit')">
        <i class="fas fa-shield-halved"></i> Audit ledger <span class="count" id="auditCount">0</span></div>

</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Title</h2>
      <button class="icon-btn" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
// ==========================================================================
// Session key. One browser sitting = one ledger spine, so the audit view can
// prove the order runs happened in across the whole session.
// ==========================================================================
if (!localStorage.getItem('econ-session')) {
  localStorage.setItem('econ-session', 'sess-' + Math.random().toString(36).slice(2, 12));
}
const SESSION = localStorage.getItem('econ-session');

if (localStorage.getItem('econ-theme') === 'light') document.documentElement.classList.add('light');

const State = {
  investigations: [], invId: null, app: 'mapper', view: 'graph',
  graph: null, network: null,
  taxonomies: null, showHidden: false, timer: null, domains: new Set(),
};

// ==========================================================================
// API
// ==========================================================================
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'X-Econ-Session': SESSION,
      'X-Econ-Client': 'tui',
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('json') ? res.json() : res.text();
}

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (v) => { if (!v) return '—';
  const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleDateString(); };

// ==========================================================================
// Taxonomy (loaded once; the whole UI colours itself from it)
// ==========================================================================
const domColor = (id) => (State.taxonomies?.domains.find(d => d.id === id) || {}).color || '#6e7681';
const domLabel = (id) => (State.taxonomies?.domains.find(d => d.id === id) || {}).label || id || 'Unclassified';

async function loadTaxonomies() {
  State.taxonomies = await api('/api/domains');
  return State.taxonomies;
}

// ==========================================================================
// Investigations
// ==========================================================================
async function loadInvestigations() {
  const url = '/api/investigations' + (State.showHidden ? '?include_hidden=true' : '');
  const data = await api(url);
  State.investigations = data.investigations;
  if (State.invId && !State.investigations.some(i => i.id === State.invId)) State.invId = null;
  if (!State.invId && State.investigations.length) State.invId = State.investigations[0].id;
  renderSidebar();
  $('#hiddenBtn').style.display = State.showHidden ? '' : 'none';
  $('#hiddenBtn').classList.toggle('active', State.showHidden);
}

function toggleHidden() { State.showHidden = !State.showHidden; loadInvestigations(); }

function renderSidebar() {
  const el = $('#invList');
  const visible = State.investigations.filter(i => !i.hidden);
  if (!visible.length) {
    el.innerHTML = `<div class="empty">${State.showHidden ? 'Nothing hidden or shown.' : 'No investigations yet.<br>Create one to start mapping.'}</div>`;
  } else {
    el.innerHTML = visible.map(i => {
      const dots = (i.domains || []).slice(0, 8)
        .map(d => `<span class="dot" style="background:${domColor(d)}" title="${esc(domLabel(d))}"></span>`).join('');
      return `<div class="inv-item ${i.id === State.invId ? 'active' : ''}" onclick="selectInvestigation(${i.id})">
        <div class="inv-item-title">${i.hidden ? '<i class="fas fa-eye-slash"></i> ' : ''}${esc(i.title)}</div>
        <div class="inv-item-meta">
          <span>${i.counts.artifacts} artifacts</span>
          <span>${i.counts.relationships} edges</span>
          ${i.counts.pending ? `<span style="color:var(--orange)">${i.counts.pending} to review</span>` : ''}
          ${i.driver ? '<span style="color:var(--purple)"><i class="fas fa-bolt"></i> driver</span>' : ''}
        </div>
        ${dots ? `<div class="inv-item-domains">${dots}</div>` : ''}
      </div>`;
    }).join('');
  }
  $('#invActions').style.display = State.invId ? '' : 'none';
}

async function selectInvestigation(id) {
  State.invId = id;
  State.domains = new Set();
  renderSidebar();
  await refreshView();
}

function currentInv() { return State.investigations.find(i => i.id === State.invId); }

function showNewInvestigation() {
  const T = State.taxonomies;
  const domains = T.domains.map(d =>
    `<label style="display:flex;gap:8px;align-items:center;font-size:12.5px;
      padding:5px 0;cursor:pointer;color:var(--text)">
      <input type="checkbox" value="${d.id}" style="width:auto;margin:0">
      <span class="dot" style="background:${d.color}"></span>
      <span style="flex:1">${d.label}</span>
      ${d.hub ? '<span class="tag" style="color:var(--purple)">hub</span>' : ''}
    </label>`).join('');
  const drivers = Object.entries(T.drivers).map(([k, v]) =>
    `<option value="${k}">${v.label}</option>`).join('');
  const sources = ['rss', 'arxiv', 'web'].map(s =>
    `<label style="display:flex;gap:8px;align-items:center;margin:0;cursor:pointer">
      <input type="checkbox" value="${s}" ${s !== 'arxiv' ? 'checked' : ''}
        style="width:auto;margin:0"><span style="color:var(--text)">${s}</span></label>`).join('');

  openModal('New investigation', `
    <div class="field"><label>Title</label>
      <input type="text" id="nTitle" placeholder="Rate path and stablecoin float"></div>
    <div class="field"><label>Keywords (comma separated)</label>
      <input type="text" id="nKeywords" placeholder="rate decision, stablecoin reserves, T-bill auction"></div>
    <div class="field"><label>Brief — what should this map answer?</label>
      <textarea id="nDesc" placeholder="Track how policy-rate decisions transmit into stablecoin reserve composition and sovereign issuance costs."></textarea></div>
    <div class="row">
      <div class="field"><label>Driver (optional — the event being tracked)</label>
        <select id="nDriver"><option value="">— topic, not an event —</option>${drivers}</select></div>
      <div class="field"><label>Sources</label><div style="display:flex;gap:14px;padding-top:6px">${sources}</div></div>
    </div>
    <div class="field"><label>Shock statement (optional, with a driver)</label>
      <input type="text" id="nShock" placeholder="A 50bp hike delivered as a surprise at the December meeting."></div>
    <div class="field"><label>Domains of interest</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">${domains}</div></div>
    <div class="banner info"><i class="fas fa-info"></i>
      <span>The agent classifies every artifact into one of these domains. Domains you
      leave unchecked are still collected, they are just not used as the brief's focus.</span></div>
  `, `
    <button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary" onclick="createInvestigation()"><i class="fas fa-plus"></i> Create</button>`);
}

async function createInvestigation() {
  const title = $('#nTitle').value.trim();
  if (!title) return toast('A title is required.', 'err');
  const body = {
    title,
    keywords: $('#nKeywords').value.trim(),
    description: $('#nDesc').value.trim(),
    driver: $('#nDriver').value || null,
    shock: $('#nShock').value.trim() || null,
    sources: $$('#modalBody input[type=checkbox]').filter(c =>
      c.closest('label')?.textContent?.trim() === c.value).map(c => c.value).join(','),
    preferred_domains: $$('#modalBody input[type=checkbox]')
      .filter(c => State.taxonomies.domains.some(d => d.id === c.value))
      .map(c => c.value).join(','),
  };
  try {
    const inv = await api('/api/investigations', { method: 'POST', body: JSON.stringify(body) });
    closeModal();
    State.invId = inv.id;
    await loadInvestigations();
    toast('Investigation created.', 'ok');
    switchView('graph');
  } catch (e) { toast('Could not create: ' + e.message, 'err'); }
}

async function deleteInvestigation() {
  const inv = currentInv();
  if (!inv) return;
  if (!confirm(`Delete "${inv.title}" and everything collected under it?\n\nRuns, artifacts, edges and answers all go.`)) return;
  try {
    await api('/api/investigations/' + inv.id, { method: 'DELETE' });
    State.invId = null;
    await loadInvestigations();
    await refreshView();
    toast('Deleted.', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

// ==========================================================================
// Views
// ==========================================================================
function switchView(view) {
  State.view = view;
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  refreshView();
}

// ==========================================================================
// Top-level apps: Mapper (per-investigation tabs) · Executive brief
// (estate-wide) · Design (the system drawn). The mapper tabs only make sense
// with an investigation; the other two are estate-wide by design.
// ==========================================================================
function switchApp(app) {
  State.app = app;
  $$('.app-btn').forEach(b => b.classList.toggle('active', b.dataset.app === app));
  const tabs = $('#tabs');
  if (tabs) tabs.style.display = app === 'mapper' ? '' : 'none';
  // The sidebar lists investigations, which only the Mapper acts on. Estate
  // apps get the full width instead of a panel that does nothing for them.
  const side = $('#sidebar');
  if (side) side.style.display = app === 'mapper' ? '' : 'none';
  document.querySelector('.layout').classList.toggle('single', app !== 'mapper');
  refreshView();
}

async function refreshView() {
  const el = $('#view');
  if (State.app === 'brief') return viewBrief(el);
  if (State.app === 'design') return viewDesign(el);
  if (State.app === 'ask') return viewAsk(el);
  if (State.app === 'imports') return viewImports(el);
  // Mapper views need an investigation selected first.
  if (!State.invId) {
    el.className = 'view';
    el.innerHTML = `<div class="empty" style="padding-top:70px">
      <i class="fas fa-chart-network" style="font-size:38px;opacity:.35;display:block;margin-bottom:14px"></i>
      Select an investigation, or create one to start mapping.</div>`;
    return;
  }
  const fns = {
    graph: viewGraph, artifacts: viewArtifacts, review: viewReview,
    gaps: viewGaps, explainer: viewExplainer, assess: viewAssess,
    board: viewBoard, manager: viewManager,
    frameworks: viewFrameworks, agents: viewAgents,
    summary: viewSummary,
    console: viewConsole, timeline: viewTimeline, audit: viewAudit,
  };
  await (fns[State.view] || viewGraph)(el);
}

// ---------- knowledge graph ----------
async function viewGraph(el) {
  el.className = 'view graph-view';
  el.innerHTML = `<div id="graph"></div>
    <div class="graph-toolbar" id="graphToolbar"></div>
    <div class="legend" id="legend"></div>`;
  const data = await api(`/api/investigations/${State.invId}/graph`);
  State.graph = data;
  drawGraph(data);
  renderLegend();
}

function drawGraph(data) {
  const nodes = new vis.DataSet(data.nodes.map(n => ({ ...n, shape: 'dot' })));
  const edges = new vis.DataSet(data.edges.map(e => ({ ...e, arrows: 'to' })));
  const container = $('#graph');
  State.network?.destroy();

  const physics = {
    solver: 'forceAtlas2Based',
    forceAtlas2Based: { gravitationalConstant: -70, centralGravity: 0.008,
      springLength: 175, springConstant: 0.045, damping: 0.5 },
    stabilization: { iterations: 220 },
  };

  State.network = new vis.Network(container, { nodes, edges }, {
    physics,
    interaction: { hover: true, tooltipDelay: 110, navigationButtons: false,
      keyboard: false },
    nodes: { borderWidth: 2, font: { size: 11, color: getComputedStyle(document.body).color } },
    edges: { smooth: { type: 'continuous' }, width: 1.4, font: { size: 9, strokeWidth: 3 } },
  });

  // Single click opens the detail overlay; the overlay's connection list
  // is walkable, so the graph can be traversed without zooming and hunting.
  State.network.on('click', (params) => {
    const n = nodes.get(params.nodes[0]);
    if (n?.id) showArtifact(n.id);
  });
  applyGraphFilters();
}

function renderLegend() {
  const L = State.graph?.legend;
  if (!L) return;
  const domains = L.domains.map(d =>
    `<div class="row ${State.domains.has(d.id) ? 'off' : ''}" data-dom="${d.id}" onclick="toggleDomain('${d.id}')">
      <span class="dot" style="background:${d.color}"></span>
      <span style="flex:1">${d.label}</span>
      <span style="color:var(--text3)">${d.id === 'macro' ? '' : ''}</span>
    </div>`).join('');
  const rels = Object.entries(L.relationships).map(([k, v]) =>
    `<div class="row" style="cursor:default">
      <span style="width:16px;height:2px;background:${v.color};display:inline-block"></span>
      <span>${v.label}</span></div>`).join('');
  $('#legend').innerHTML =
    `<h4>Domains <span style="float:right;color:var(--text3);cursor:pointer" onclick="document.getElementById('legend').classList.toggle('collapsed')">▾</span></h4>${domains}
     <h4>Edges</h4>${rels}`;
}

function toggleDomain(id) {
  State.domains.has(id) ? State.domains.delete(id) : State.domains.add(id);
  applyGraphFilters();
  renderLegend();
}

function applyGraphFilters() {
  if (!State.network || !State.graph) return;
  const nodes = State.network.body.data.nodes;
  const all = new Map(State.graph.nodes.map(n => [n.id, n]));
  const keep = new Set(
    State.graph.nodes.filter(n => !State.domains.size ||
      (n.domain && State.domains.has(n.domain))).map(n => n.id));
  nodes.update([...all.values()].map(n => ({
    id: n.id, hidden: !keep.has(n.id),
  })));
  $('#graphToolbar').innerHTML =
    `<span class="pill">${keep.size}/${all.size} nodes</span>
     ${State.domains.size ? '<button class="icon-btn" onclick="State.domains.clear();applyGraphFilters();renderLegend()">clear filters</button>' : ''}`;
}

// ---------- artifacts ----------
async function viewArtifacts(el) {
  el.className = 'view';
  const rows = await api(`/api/investigations/${State.invId}/artifacts`);
  el.innerHTML = `
    <div class="card">
      <h3><i class="fas fa-box-archive"></i> Collected artifacts
        <span class="sub">${rows.count} items — the <em>collected</em> view, not the triage view</span></h3>
      <div class="row" style="margin-bottom:12px">
        <input type="text" id="artSearch" placeholder="Filter by title, description or tag…" oninput="filterArtifacts()">
        <select id="fType" onchange="filterArtifacts()"><option value="">All types</option>
          ${Object.entries(State.taxonomies.artifact_types).map(([k, v]) =>
            `<option value="${k}">${v.label}</option>`).join('')}</select>
        <select id="fDomain" onchange="filterArtifacts()"><option value="">All domains</option>
          ${State.taxonomies.domains.map(d => `<option value="${d.id}">${d.label}</option>`).join('')}</select>
        <select id="fReview" onchange="filterArtifacts()"><option value="">Any state</option>
          <option value="pending">Pending</option><option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option></select>
      </div>
      <div id="artRows">${rows.artifacts.map(a => artifactCard(a, false)).join('') ||
        '<div class="empty">Nothing collected yet. Press Collect.</div>'}</div>
    </div>`;
  $('#artSearch').dataset.rows = rows.artifacts.length;
}

function filterArtifacts() {
  const q = ($('#artSearch')?.value || '').toLowerCase();
  const type = $('#fType')?.value, dom = $('#fDomain')?.value, rev = $('#fReview')?.value;
  const rows = (State.lastArtifacts || []);
  const hit = rows.filter(a =>
    (!q || `${a.title} ${a.description} ${a.tags}`.toLowerCase().includes(q)) &&
    (!type || a.artifact_type === type) &&
    (!dom || a.domain === dom) &&
    (!rev || a.review === rev));
  $('#artRows').innerHTML = hit.map(a => artifactCard(a, false)).join('') ||
    '<div class="empty">Nothing matches those filters.</div>';
}

async function reloadArtifacts() {
  if (State.view === 'artifacts' || State.view === 'review') await refreshView();
  await loadInvestigations();
  updateBadges();
}

// ---------- review ----------
async function viewReview(el) {
  el.className = 'view';
  const data = await api(`/api/investigations/${State.invId}/artifacts`);
  State.lastArtifacts = data.artifacts;
  const groups = [
    { key: 'pending', label: 'Needs review', open: true },
    { key: 'drift', label: 'Drift flagged', open: true, filter: a => a.drift },
    { key: 'accepted', label: 'Accepted', open: false },
    { key: 'rejected', label: 'Rejected', open: false },
  ];
  const assigned = new Set();
  let html = '';
  for (const g of groups) {
    const items = data.artifacts.filter(g.filter || (a => a.review === g.key));
    items.forEach(a => assigned.add(a.id));
    if (!items.length) continue;
    html += `<div class="group ${g.open ? '' : 'collapsed'}" data-group="${g.key}">
      <div class="group-head" onclick="this.parentElement.classList.toggle('collapsed')">
        <i class="fas fa-chevron-down caret"></i>
        <strong>${g.label}</strong>
        <span class="pill">${items.length}</span>
        <span style="margin-left:auto"><button class="icon-btn sm"
          onclick="event.stopPropagation();toggleAllGroups()">⇅ all</button></span>
      </div>
      <div class="group-body">${items.map(a => artifactCard(a, true)).join('')}</div>
    </div>`;
  }
  const orphans = data.artifacts.filter(a => !assigned.has(a.id));
  if (orphans.length) html += `<div class="group"><div class="group-head">
    <strong>Other</strong><span class="pill">${orphans.length}</span></div>
    <div class="group-body">${orphans.map(a => artifactCard(a, true)).join('')}</div></div>`;

  el.innerHTML = `<div class="card">
    <h3><i class="fas fa-list-check"></i> Review queue
      <span class="sub">accepting feeds the graph, rejecting dims the node</span></h3>
    ${html || '<div class="empty">Nothing to review.</div>'}</div>`;
}

function toggleAllGroups() {
  const collapsed = $$('.group').some(g => g.classList.contains('collapsed'));
  $$('.group').forEach(g => g.classList.toggle('collapsed', !collapsed));
}

function artifactCard(a, withActions) {
  const typeLabel = State.taxonomies.artifact_types[a.artifact_type]?.label || a.artifact_type;
  const dirCls = a.direction === 'up' ? 'up' : a.direction === 'down' ? 'down' : 'flat';
  const dirTxt = a.direction ? `${a.direction}${a.horizon ? ' · ' + a.horizon : ''}` : '';
  const ringPct = Math.round((a.relevance || 0) * 100);
  return `<div class="artifact ${a.review === 'rejected' ? 'rejected' : ''} ${a.drift ? 'drift' : ''}"
      onclick="showArtifact(${a.id})" style="cursor:pointer">
    <div class="art-head">
      <div style="flex:1;min-width:0">
        <div class="art-title">${esc(a.title)}</div>
      </div>
      <div class="relevance-ring" title="agent relevance ${ringPct}%">${ringPct}</div>
    </div>
    <div class="art-desc">${esc((a.description || '').slice(0, 260))}${(a.description || '').length > 260 ? '…' : ''}</div>
    <div class="art-meta">

function gapCard(x, row) {
  const status = row?.status || 'open';
  const badge = status === 'ruled_out' ? '<span class="tag" style="color:var(--green)">covered</span>'
    : status === 'investigating' ? '<span class="tag" style="color:var(--accent)">investigating</span>'
    : `<span class="tag" style="color:var(--orange)">${x.priority} priority</span>`;
  return `<div class="gap ${x.priority >= 5 ? 'priority' : ''}">
    <div class="domain-name"><span class="dot" style="background:${x.color}"></span>
      ${esc(x.label)} ${badge}
      ${x.hub ? '<span class="tag" style="color:var(--purple)">hub</span>' : ''}</div>
    <div class="gap-why">${esc(x.why)}</div>
    ${row ? `<div class="gap-query">${esc(row.query || row.dimension)}</div>` : ''}
    <div class="art-actions">
      ${row ? `<button class="btn sm primary" onclick="runGap(${row.id})">
        <i class="fas fa-play"></i> Run a targeted collection</button>` : ''}
      <button class="btn sm" onclick="askAbout('${esc(x.label).replace(/'/g, "\\'")}')">
        <i class="fas fa-lightbulb"></i> Ask anyway</button>
    </div></div>`;
}

async function askQuestion() {
  const question = $('#qText').value.trim();
  if (!question) return toast('Ask something first.', 'err');
  const btn = $('#askBtn');
  btn.disabled = true;
  $('#askStatus').innerHTML = `<div class="banner info" style="margin-top:12px">
    <i class="fas fa-spinner spin"></i><span>Retrieving sources and drafting. The answer will be
    verified against every quote it cites before it appears.</span></div>`;
  try {
    await api(`/api/investigations/${State.invId}/explain`, {
      method: 'POST',
      body: JSON.stringify({
        question, mode: $('#qMode').value, depth: $('#qDepth').value,
        audience: $('#qAud').value,
      }),

  } catch (e) {
    $('#askStatus').innerHTML = '';
    btn.disabled = false;
    toast(e.message, 'err');

function expCard(e) {
  const conf = e.confidence ?? 0;
  const confColor = conf >= 0.6 ? 'var(--green)' : conf >= 0.35 ? 'var(--orange)' : 'var(--red)';
  const dropped = e.dropped_citations || 0;
  return `<div class="card" id="exp-${e.id}">
    <div class="art-head">
      <div class="art-title" style="flex:1">${esc(e.question)}</div>
      <div style="display:flex;gap:6px">
        ${e.bookmarked ? '<i class="fas fa-bookmark" style="color:var(--orange)"></i>' : ''}
        ${e.watched ? '<i class="fas fa-eye" style="color:var(--accent)"></i>' : ''}
      </div>
    </div>
    <div class="meta-strip">
      <span class="tag">${esc(e.mode)}</span>
      <span class="tag">${esc(e.depth)}</span>
      <span>${fmtDate(e.created_at)}</span>
      ${e.domains?.length ? e.domains.map(d => `<span class="tag dom"
        style="background:${domColor(d)}">${esc(domLabel(d))}</span>`).join('') : ''}
      ${e.confidence != null ? `<span style="display:flex;align-items:center;gap:6px">
        <span class="conf-bar"><i style="width:${Math.round(conf * 100)}%;background:${confColor}"></i></span>
        confidence ${conf.toFixed(2)}</span>` : ''}
      ${dropped ? `<span class="tag" style="color:var(--red)">
        ${dropped} unverifiable citation${dropped > 1 ? 's' : ''}</span>` : ''}
      ${e.status === 'no_evidence' ? '<span class="tag" style="color:var(--orange)">no evidence — filed as a gap</span>' : ''}
    </div>
    <div class="answer" data-raw="${esc(e.answer || '')}">${renderAnswer(e.answer)}</div>
    <div class="art-actions" style="margin-top:14px">
      <button class="btn sm" onclick="showSources(${e.id})"><i class="fas fa-book-open"></i> Evidence</button>
      ${e.critique ? `<button class="btn sm" onclick="showCritique(${e.id})"><i class="fas fa-scale-balanced"></i> Self-critique</button>` : ''}
      ${e.roadmap ? `<button class="btn sm" onclick="showRoadmap(${e.id})"><i class="fas fa-route"></i> Roadmap</button>` : ''}
      <button class="btn sm" onclick="followUp(${e.id})"><i class="fas fa-reply"></i> Follow up</button>
      <button class="btn sm" onclick="makeQuiz(${e.id})"><i class="fas fa-graduation-cap"></i> Quiz</button>
      <button class="btn sm" onclick="toggleBookmark(${e.id})"><i class="fas fa-bookmark"></i> ${e.bookmarked ? 'Unbookmark' : 'Bookmark'}</button>
      <button class="btn sm" onclick="toggleWatch(${e.id})"><i class="fas fa-eye"></i> ${e.watched ? 'Unwatch' : 'Watch for drift'}</button>
    </div>
    <div id="expextra-${e.id}"></div>
  </div>`;
}

function renderAnswer(md) {
  if (!md) return '';
  // Citation markers become chips: a green one was verified verbatim, a red
  // struck-through one was dropped. The reader can see the check, not just be
  // told it happened.
  let html = marked.parse(md);
  html = html.replace(/\[(\d{1,3})\]/g, (m, n) =>
    `<span class="cite" title="source ${n}">${n}</span>`);
  return html;
}

async function showSources(id) {
  const e = await api('/api/explanations/' + id);
  const droppedIds = (e.trace?.dropped || []).map(d => d.index);
  openModal('Evidence', `
    <div class="banner info"><i class="fas fa-shield-halved"></i>
      <span>${e.trace?.grounding?.n_verified ?? 0} of ${e.trace?.grounding?.n_citations ?? 0}
      citations carry a quote that appears verbatim in the cited source.
      ${droppedIds.length ? `<strong>${droppedIds.length}</strong> citation(s) could not be verified and were dropped: ${droppedIds.join(', ')}.` : ''}
      Confidence follows <em>distinct sources</em>, not quote count — five quotes from one document
      do not read as five sources agreeing.</span></div>
    <div class="sources">${(e.sources || []).map(s => {
      const dropped = droppedIds.includes(s.index);
      const isWeb = s.origin === 'web';
      return `<div class="source-item ${dropped ? 'dropped' : ''}">
        <div><strong>[${s.index}]</strong> ${esc(s.title)}</div>

function drawBriefGraph(data) {
  const container = $('#briefGraph');
  if (!container) return;
  State.briefNetwork?.destroy();
  const nodes = new vis.DataSet((data.nodes || []).map(n => ({
    id: n.id, label: n.label, title: n.title, shape: 'dot',
    size: n.group === 'investigation' ? 22 : 10 + Math.min(14, (n.value || 1) * 2),
    color: n.color, font: { size: 11, color: getComputedStyle(document.body).color },
    opacity: n.review === 'rejected' ? 0.28 : 1.0,
  })));
  const edges = new vis.DataSet((data.edges || []).map(e => ({
    id: e.id, from: e.from, to: e.to, arrows: 'to',
    color: e.color, dashes: !!e.dashes,
  })));
  State.briefNetwork = new vis.Network(container, { nodes, edges }, {
    physics: { solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.008,
        springLength: 160, springConstant: 0.045, damping: 0.5 },
      stabilization: { iterations: 200 } },
    interaction: { hover: true, tooltipDelay: 110 },
  });
  State.briefNetwork.on('click', (params) => {
    const id = params.nodes[0];
    if (typeof id !== 'string') return;
    if (id.startsWith('a:')) showArtifact(parseInt(id.slice(2), 10));
    else if (id.startsWith('inv:')) {
      State.invId = parseInt(id.slice(4), 10);
      renderSidebar();
      switchApp('mapper');
      switchView('graph');
    }
  });
}

async function renderDoc(id) {
  $$('.doc-item').forEach(d => d.classList.toggle('active', d.id === 'doc-' + id));
  const v = $('#docViewer');
  v.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const doc = await api('/api/design/docs/' + id);
    // Pull mermaid blocks out BEFORE marked sees them: marked would escape
    // the arrows (-->) into entities mermaid cannot parse back.
    const blocks = [];
    const fenced = doc.markdown.replace(/```mermaid\n([\s\S]*?)```/g, (m, code) => {
      blocks.push(code);
      return '\n\n<div class="mermaid-src" data-i="' + (blocks.length - 1) + '"></div>\n\n';
    });
    v.innerHTML = '<div class="answer">' + marked.parse(fenced) + '</div>';
    const spots = v.querySelectorAll('.mermaid-src');
    if (!spots.length) return;
    if (!window.mermaid) {
      spots.forEach(s => {
        s.outerHTML = '<pre>' + esc(blocks[+s.dataset.i]) + '</pre>';
      });
      toast('Diagrams need the mermaid CDN (offline?) — showing source.', 'err');
      return;
    }
    try {
      mermaid.initialize({ startOnLoad: false, theme: 'dark' });
      for (const s of spots) {
        const code = blocks[+s.dataset.i];
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = code;
        s.replaceWith(div);
      }
      await mermaid.run({ nodes: v.querySelectorAll('.mermaid') });
    } catch (e) {
      v.querySelectorAll('.mermaid').forEach(d => {
        d.outerHTML = '<pre>' + esc(d.textContent) + '</pre>';
      });
    }
  } catch (e) { v.innerHTML = '<div class="banner err">' + esc(e.message) + '</div>'; }
}

async function loadAskThreads() {
  const box = $('#askThreads');
  if (!box) return;
  try {
    const group = $('#askGroup')?.value || '';
    State.askGroup = group;
    const data = await api('/api/ask/threads?limit=30' + (group ? '&group=' + encodeURIComponent(group) : ''));
    State.askThreadList = data.threads;
    const sel = $('#askGroup');
    if (sel && sel.options.length <= 1 && (data.groups || []).length) {
      const keep = State.askGroup || '';
      sel.innerHTML = '<option value="">All groups</option>' +
        data.groups.map(g => `<option value="${esc(g.group)}">${esc(g.group)} (${g.count})</option>`).join('');
      if (keep) sel.value = keep;
    }
    box.innerHTML = data.threads.map(t => `
      <div class="source-item" style="margin-bottom:7px">
        <div style="cursor:pointer" onclick="openAskThread(${t.id})">
          <strong>${esc(t.question.slice(0, 110))}</strong></div>

      </div>`).join('') || '<div class="empty">No threads yet. Answers land here as they finish.</div>';

    </div>`;
    const root = $('#askThread');
    if (root) { root.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    if (graph) drawAskGraph(graph);
    hydrateMermaid(box);
  } catch (e) { box.innerHTML = '<div class="banner err">' + esc(e.message) + '</div>'; }
}

function drawAskGraph(data) {
  const container = $('#askGraph');
  if (!container) return;
  State.askNetwork?.destroy();
  const nodes = new vis.DataSet((data.nodes || []).map(n => ({
    id: n.id, label: n.label, title: n.title, shape: 'dot',
    size: n.group === 'message' ? 20 : 10 + Math.min(12, (n.value || 1) * 2),
    color: n.color, font: { size: 11, color: getComputedStyle(document.body).color },
    opacity: n.review === 'rejected' ? 0.28 : 1.0,
  })));
  const edges = new vis.DataSet((data.edges || []).map(e => ({
    id: e.id, from: e.from, to: e.to, arrows: 'to',
    color: e.color, dashes: !!e.dashes, font: { size: 9, strokeWidth: 3 },
  })));
  State.askNetwork = new vis.Network(container, { nodes, edges }, {
    physics: { solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -70, centralGravity: 0.01,
        springLength: 150, springConstant: 0.05, damping: 0.5 },
      stabilization: { iterations: 180 } },
    interaction: { hover: true, tooltipDelay: 110 },
  });
  State.askNetwork.on('click', (params) => {
    const nid = params.nodes[0];
    if (typeof nid !== 'string') return;
    if (nid.startsWith('a:')) showArtifact(parseInt(nid.slice(2), 10));
    else if (nid.startsWith('w:')) {
      const n = nodes.get(nid);
      if (n?.title) window.open(n.title, '_blank', 'noopener');
    } else if (nid.startsWith('e:')) {
      const mid = parseInt(nid.slice(2), 10);
      const target = document.getElementById('askmsg-' + mid);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

function renderAskNode(n, depth) {
  const conf = n.confidence ?? 0;
  const confColor = conf >= 0.6 ? 'var(--green)' : conf >= 0.35 ? 'var(--orange)' : 'var(--red)';
  const kids = (n.children || []).map(c => renderAskNode(c, depth + 1)).join('');
  return `<div class="ask-node ${depth === 0 ? 'root' : ''}" id="askmsg-${n.id}">
    <div class="ask-q">${esc(n.question)}</div>
    ${n.status === 'done' && n.answer ? `<div class="answer">${renderAnswer(n.answer)}</div>` : ''}
    ${n.status === 'no_evidence' ? `<div class="banner warn" style="margin:8px 0">
      <i class="fas fa-triangle-exclamation"></i><span>No evidence — filed as a research gap.</span></div>` : ''}
    ${n.status === 'running' ? '<div class="empty">Answering…</div>' : ''}
    <div class="meta-strip" style="margin:10px 0">
      ${n.domains?.length ? n.domains.map(d => `<span class="tag dom"
        style="background:${domColor(d)}">${esc(domLabel(d))}</span>`).join('') : ''}
      ${n.confidence != null ? `<span style="display:flex;align-items:center;gap:6px">
        <span class="conf-bar"><i style="width:${Math.round(conf * 100)}%;background:${confColor}"></i></span>
        ${conf.toFixed(2)}</span>` : ''}
      ${n.dropped_citations ? `<span class="tag" style="color:var(--red)">${n.dropped_citations} dropped</span>` : ''}
    </div>
    <div class="art-actions">
      <button class="btn sm" onclick="showSources(${n.id})"><i class="fas fa-book-open"></i> Evidence</button>
      <button class="btn sm" onclick="askDiagram(${n.id})"><i class="fas fa-diagram-project"></i> Channel map</button>
      <button class="btn sm" onclick="toggleAskComposer(${n.id})"><i class="fas fa-reply"></i> Follow up</button>
      <button class="btn sm" onclick="promoteThread(${n.id})"><i class="fas fa-plus"></i> Promote to investigation</button>
      <button class="btn sm" onclick="makeQuiz(${n.id})"><i class="fas fa-graduation-cap"></i> Quiz</button>
    </div>
    <div id="askcomp-${n.id}" style="display:none;margin-top:10px">
      <textarea id="asktext-${n.id}" rows="2" placeholder="Follow-up — answers here branch from this message…"></textarea>
      <div style="margin-top:8px"><button class="btn sm primary" onclick="submitAskFollowup(${n.id})">Ask follow-up</button></div>
    </div>
    <div id="expextra-${n.id}"></div>
    ${kids}
  </div>`;
}

function toggleAskComposer(id) {
  const c = $('#askcomp-' + id);
  if (c) { c.style.display = c.style.display === 'none' ? '' : 'none'; }
}

async function submitAskFollowup(id) {
  const q = $('#asktext-' + id).value.trim();
  if (!q) return toast('Ask something first.', 'err');
  try {
    await api(`/api/explanations/${id}/followup`, {
      method: 'POST', body: JSON.stringify({ question: q }) });
    State.askPendingQ = null;
    toast('Follow-up queued — it will branch from this message.', 'ok');
    startPolling();
  } catch (e) { toast(e.message, 'err'); }
}

async function askDiagram(id) {
  try {
    const e = await api('/api/explanations/' + id);
    const dia = e.trace?.diagram;
    const box = $('#expextra-' + id);
    if (!dia) { box.innerHTML = '<div class="banner warn" style="margin-top:12px">No channel map — the answer never crossed a domain.</div>'; return; }
    box.innerHTML = `<div class="card" style="margin:14px 0 0;background:var(--bg2)">
      <h3><i class="fas fa-diagram-project"></i> Channel map
        <span class="sub">derived from the taxonomy, never drafted</span></h3>
      <div class="gap-query">${esc(dia)}</div><div class="dia-out"></div></div>`;
    hydrateMermaidText(box, dia);
  } catch (e) { toast(e.message, 'err'); }
}

function hydrateMermaid(root) {
  // Render every .mermaid block under root; failures keep source visible.
  if (!window.mermaid) return;
  try {
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    mermaid.run({ nodes: root.querySelectorAll('.mermaid') });
  } catch (e) {}
}

function hydrateMermaidText(box, code) {
  const out = box.querySelector('.dia-out');
  if (!out) return;
  if (!window.mermaid) {
    out.innerHTML = '<div class="banner warn" style="margin-top:8px">Diagrams need the mermaid CDN (offline?).</div>';
    return;
  }
  const div = document.createElement('div');
  div.className = 'mermaid';
  div.textContent = code;
  out.appendChild(div);
  try {
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    mermaid.run({ nodes: [div] }).catch(() => {
      div.outerHTML = '<pre>' + esc(code) + '</pre>';
    });
  } catch (e) {
    div.outerHTML = '<pre>' + esc(code) + '</pre>';
  }
}

async function promoteThread(id) {
  if (!confirm('Promote this answer into a new investigation and start collecting?')) return;
  try {
    const r = await api('/api/ask/promote', {
      method: 'POST', body: JSON.stringify({ explanation_id: id }) });
    toast(`Promoted to investigation #${r.investigation_id}. Collecting.`, 'ok');
    await loadInvestigations();
    State.askOpen = null;
  } catch (e) { toast(e.message, 'err'); }
}

async function runElasticSearch() {
  const q = $('#esQ').value.trim();
  const box = $('#esResults');
  if (!q) return;
  box.innerHTML = '<div class="empty">Searching everything…</div>';
  try {
    const type = $('#esType').value;
    const r = await api('/api/search/all?q=' + encodeURIComponent(q) +
      (type ? '&doc_type=' + type : ''));
    if (!r.results.length) {
      box.innerHTML = '<div class="empty">Nothing matches. The index rebuilds after every run — ' +
        '<a href="#" onclick="reindexSearch();return false">reindex now</a>.</div>';
      return;
    }
    box.innerHTML = r.results.map(h => `
      <div class="source-item" style="margin-bottom:7px;cursor:pointer"
        onclick="openSearchDoc('${h.doc_type}', ${h.doc_id}, ${h.investigation_id ?? 'null'})">
        <div><span class="tag">${esc(h.doc_type)}</span> <strong>${esc(h.title.slice(0, 100))}</strong></div>
        <div style="color:var(--text2);font-size:12px;margin-top:5px">${h.snippet}</div>
      </div>`).join('') +
      (r.fallback ? '<div style="font-size:11px;color:var(--text3)">No exact phrase — showing AND matches.</div>' : '');
  } catch (e) { box.innerHTML = '<div class="banner err">' + esc(e.message) + '</div>'; }
}

async function reindexSearch() {
  const r = await api('/api/search/reindex', { method: 'POST' });
  toast(`Indexed ${r.total} document(s).`, 'ok');
  await runElasticSearch();
}

async function openSearchDoc(type, id, invId) {
  if (type === 'artifact') return showArtifact(id);
  if (type === 'explanation') {
    try {
      const e = await api('/api/explanations/' + id);
      State.askOpen = e.thread_id || e.id;
      await openAskThread(State.askOpen);
      $('#askThread').scrollIntoView({ behavior: 'smooth' });
    } catch (e2) { toast(e2.message, 'err'); }
    return;
  }
  if (type === 'assessment') return showAssessment(id);
  if (type === 'investigation' && invId) {
    State.invId = invId;
    renderSidebar();
    switchApp('mapper');
    switchView('graph');
  }
}

// ---------- imports ----------
// Imported chat history as a clustered graph: group hubs plus member items,
// orange pending and green answered. Navigation, not evidence — clicking an
// item opens its thread in the Ask tab, clicking a hub scopes to the group.
// ---------- imports ----------
// Imported chat history, two ways to navigate it. Conversations renders each
// import as the chat it was — user right, assistant left, in original order.
// Clusters renders the content-group graph for jumping between topics. Both
// read the same endpoints; the toggle only changes the lens.
async function viewImports(el) {
  el.className = 'view';
  const group = State.importsGroup || '';
  const mode = State.importsMode || 'chats';
  const clusterMode = State.importsClusterMode || 'group';
  const q = group ? '?group=' + encodeURIComponent(group) : '';
  const [g, convs] = await Promise.all([
    api('/api/ask/imports/graph' + q + (q ? '&' : '?') + 'mode=' + clusterMode).catch(() => ({ nodes: [], edges: [], groups: [], counts: {} })),
    api('/api/ask/imports/conversations' + (group ? '?group=' + encodeURIComponent(group) : '')).catch(() => ({ conversations: [] })),
  ]);
  const counts = g.counts || {};
  const turns = convs.conversations.flatMap(c => c.items);
  const answered = turns.filter(t => t.answer).length;
  el.innerHTML = `
    <div class="grid c4" style="margin-bottom:14px">
      <div class="stat"><div class="n">${counts.items ?? turns.length}</div><div class="l">Imported items</div></div>
      <div class="stat"><div class="n">${convs.conversations.length}</div><div class="l">Conversations</div></div>
      <div class="stat"><div class="n" style="color:var(--green)">${answered}</div><div class="l">Answered turns</div></div>
      <div class="stat"><div class="n" style="color:var(--orange)">${turns.length - answered}</div><div class="l">Awaiting answer</div></div>
    </div>
    <div class="card">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <button class="btn sm ${mode === 'chats' ? 'primary' : ''}" onclick="setImportsMode('chats')">
          <i class="fas fa-comments"></i> Conversations</button>
        <button class="btn sm ${mode === 'clusters' ? 'primary' : ''}" onclick="setImportsMode('clusters')">
          <i class="fas fa-diagram-project"></i> Clusters</button>
        ${mode === 'clusters' ? `
          <button class="btn sm ${clusterMode === 'group' ? 'primary' : ''}" onclick="setImportsClusterMode('group')">by group</button>
          <button class="btn sm ${clusterMode === 'tags' ? 'primary' : ''}" onclick="setImportsClusterMode('tags')">by shared tags</button>` : ''}
        <span style="flex:1"></span>
        <button class="btn sm ${group ? '' : 'primary'}" onclick="setImportsGroup('')">All groups</button>
        ${(g.groups || []).map(x => `<button class="btn sm ${group === x.group ? 'primary' : ''}"
          onclick="setImportsGroup('${esc(x.group).replace(/'/g, "\\'")}')">${esc(x.group)} (${x.count})</button>`).join('')}
      </div>
      <div id="importsBody"></div>
    </div>`;
  if (mode === 'clusters') renderImportsClusters(g);
  else renderImportsChats(convs);
}

function setImportsClusterMode(m) {
  State.importsClusterMode = m;
  refreshView();
}

function setImportsGroup(g) {
  State.importsGroup = g || null;
  refreshView();
}

function setImportsMode(m) {
  State.importsMode = m;
  refreshView();
}

function renderImportsChats(convs) {
  const box = $('#importsBody');
  if (!box) return;
  const rows = convs.conversations || [];
  box.innerHTML = rows.map((c, ci) => {
    const turns = c.items;
    const collapsed = turns.length > 4;
    const visible = collapsed ? [...turns.slice(0, 2), ...turns.slice(-1)] : turns;
    const hidden = collapsed ? turns.slice(2, -1) : [];
    return `
    <div class="card" style="background:var(--bg);margin-bottom:12px">
      <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px">
        <strong style="font-size:13.5px">${esc(c.title.slice(0, 90))}</strong>
        <span class="tag">${esc(c.group)}</span>
        <span style="color:var(--text3);font-size:11px">
          ${turns.length} turn${turns.length === 1 ? '' : 's'} · ${c.open ? c.open + ' open' : 'all answered'}</span>
        <span style="flex:1"></span>
        ${c.open ? `<button class="btn sm" onclick="answerAllOpen(${c.items.filter(i => !i.answer).map(i => i.id).join(',')})">Answer all open (${c.open})</button>` : ''}
      </div>
      ${visible.map(it => renderImportsTurn(it)).join('')}
      ${hidden.length ? `<div id="convhidden-${ci}" style="display:none">
        ${hidden.map(it => renderImportsTurn(it)).join('')}</div>
        <button class="btn sm" onclick="toggleConvHidden(${ci}, this)">
          Show ${hidden.length} earlier turn${hidden.length === 1 ? '' : 's'}</button>` : ''}
    </div>`;
  }).join('') || '<div class="empty">Nothing imported yet — use Ask → Import history.</div>';
}

function renderImportsTurn(it) {
  return `
    <div class="chat-row ${it.answer ? '' : 'open'}">
      <div class="chat-bubble q">${esc(it.question)}</div>
      <div style="color:var(--text3);font-size:10.5px;margin:4px 0 0 auto;width:fit-content">
        ${esc(it.asked_at || '')}</div>
      ${it.answer
        ? `<div class="chat-bubble a"><div class="answer">${renderAnswer(it.answer)}</div></div>
           <div class="chat-meta">
             <span class="tag" style="color:var(--text3)">imported — unverified</span>
             ${(it.tags || []).slice(0, 4).map(tag => `<span class="tag" style="color:var(--teal)">${esc(tag)}</span>`).join('')}
             <button class="btn sm" onclick="openImportThread(${it.id})">Open thread</button>
           </div>`
        : `<div class="chat-meta"><span class="tag" style="color:var(--orange)">awaiting answer</span>
           <button class="btn sm primary" onclick="answerImported(${it.id})">Answer</button>
           <button class="btn sm" onclick="openImportThread(${it.id})">Open thread</button></div>`}
    </div>`;
}

function toggleConvHidden(ci, btn) {
  const el = document.getElementById('convhidden-' + ci);
  if (!el) return;
  const open = el.style.display === 'none';
  el.style.display = open ? '' : 'none';
  btn.textContent = open ? 'Hide earlier turns' : btn.textContent;
}

async function answerAllOpen(...ids) {
  if (!ids.length) return;
  if (!confirm(`Answer ${ids.length} open question(s)? Each queues its own job.`)) return;
  for (const id of ids) {
    try {
      await api('/api/ask', { method: 'POST',
        body: JSON.stringify({ explanation_id: id }) });
    } catch (e) { toast(e.message, 'err'); return; }
  }
  toast(`Queued ${ids.length} answer(s).`, 'ok');
  startPolling();
}

function renderImportsClusters(g) {
  const box = $('#importsBody');
  if (!box) return;
  const mode = State.importsClusterMode || 'group';
  box.innerHTML = `
    <div class="card" style="background:var(--bg);margin-bottom:0">
      <h3><i class="fas fa-diagram-project"></i> Import clusters
        <span class="sub">${mode === 'tags' ? 'shared-vocabulary components — where groups ask the same thing' : 'grey hubs are content groups — click one to scope, click an item to open its thread'}</span></h3>
      <div id="importsGraph"></div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">
        Orange items await an answer · green are answered.</div>
    </div>`;
  drawImportsGraph(g);
}

function openImportThread(id) {
  State.askOpen = id;
  switchApp('ask');
}

function drawImportsGraph(data) {
  const container = $('#importsGraph');
  if (!container) return;
  State.importsNetwork?.destroy();
  const nodes = new vis.DataSet((data.nodes || []).map(n => ({
    id: n.id, label: n.label, title: n.title, shape: 'dot',
    size: n.group === 'hub' ? 24 : 12,
    color: n.color, font: { size: 11, color: getComputedStyle(document.body).color },
  })));
  const edges = new vis.DataSet((data.edges || []).map(e => ({
    id: e.id, from: e.from, to: e.to,
    color: e.color, dashes: !!e.dashes,
  })));
  State.importsNetwork = new vis.Network(container, { nodes, edges }, {
    physics: { solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -70, centralGravity: 0.008,
        springLength: 170, springConstant: 0.045, damping: 0.5 },

  State.importsNetwork.on('click', (params) => {

    if (nid.startsWith('i:')) openImportThread(parseInt(nid.slice(2), 10));
    else if (nid.startsWith('g:')) setImportsGroup(nid.slice(2));
  });
}

async function downloadDossier() {
  try {
    const res = await fetch(`/api/investigations/${State.invId}/dossier?fmt=markdown`,
      { headers: { 'X-Econ-Session': SESSION } });
    const text = await res.text();
    const blob = new Blob([text], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${State.invId}-report.md`;
    a.click();
    toast('Report downloaded.', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function downloadFile(path, filename, doneMsg) {
  try {
    const res = await fetch(path, { headers: { 'X-Econ-Session': SESSION } });
    if (!res.ok) throw new Error(await res.text());
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    toast(doneMsg || 'Downloaded.', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

  const cls = e.verdict === 'deny' ? 'deny' : e.severity === 'warn' ? 'flag' : '';
  return `<div class="chain-event ${cls}" data-run="${esc(e.run_id)}">
    <div class="top">
      <span class="seq">#${e.seq}</span>
      <span class="kind">${esc(e.kind)}</span>
      <span class="actor">${esc(e.actor)}</span>
      ${e.verdict ? `<span class="tag" style="color:var(--${e.verdict === 'deny' ? 'red' : e.verdict === 'flag' ? 'orange' : 'green'})">${esc(e.verdict)}</span>` : ''}

      <span class="hash" title="${esc(e.hash)}">${esc(e.hash.slice(0, 10))}…</span>
    </div>
    <details><summary style="cursor:pointer;font-size:11px;color:var(--text3)">data</summary>
      <div class="data">${esc(JSON.stringify(e.data, null, 2))}</div>
      <div style="color:var(--text3);font-size:10px;margin-top:5px">
        prev ${esc((e.prev_hash || '').slice(0, 16))}… → ${esc(e.hash.slice(0, 16))}…</div>
    </details></div>`;
}

function filterChain() {
  const v = $('#chainSel').value;
  $$('#chainList .chain-event').forEach(el => {
    el.style.display = !v || el.dataset.run === v ? '' : 'none';

}

async function loadChain() {
  const id = $('#ledgerSel').value;
  if (!id) return;
  const data = await api('/api/ledger/runs/' + id);
  const v = data.verified || {};
  $('#chainDetail').innerHTML = `
    <div class="banner ${v.ok ? 'ok' : 'err'}" style="margin-bottom:12px">
      <i class="fas fa-${v.ok ? 'check' : 'triangle-exclamation'}"></i>
      <span>${v.ok ? `Verified — ${v.events} events re-derive from the genesis hash.`
        : 'Verification failed: ' + (v.problems || []).map(p => `${p.problem} at seq ${p.seq}`).join('; ')}
      ${v.proof_drift ? ` ${v.proof_drift} proof(s) drifted.` : ''}
      ${v.unknown_kinds?.length ? ` Unknown kinds: ${v.unknown_kinds.join(', ')}.` : ''}</span></div>
    <div style="margin-bottom:12px;display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn sm" onclick="exportChain('${id}')"><i class="fas fa-file-export"></i> Export self-verifying bundle</button>
      <button class="btn sm" onclick="downloadFile('/api/ledger/siem-export/text?run_id=${id}&limit=500',
        '${id}-siem.ndjson', 'SIEM lines downloaded (minimised payloads).')"><i class="fas fa-tower-broadcast"></i> SIEM export</button>
    </div>
    <div class="chain">${data.events.slice(0, 200).map(chainEvent).join('')}</div>`;
}

async function exportChain(id) {
  const doc = await api(`/api/ledger/runs/${id}/export`);
  const res = await fetch('/api/ledger/verify-export', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(doc),
  });
  const verdict = await res.json();
  const blob = new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${id}-audit.json`;
  a.click();
  toast(verdict.ok
    ? 'Bundle exported. It verifies offline with no database attached.'
    : 'Exported, but the offline check failed: ' + JSON.stringify(verdict.problems),
    verdict.ok ? 'ok' : 'err');
}
