        <input type="number" id="maxRounds" value="${inv.schedule_max_rounds || 2}" min="1" max="6"></div>
    </div>
    <label style="display:flex;gap:9px;align-items:center;cursor:pointer;color:var(--text)">
      <input type="checkbox" id="schedOn" ${inv.schedule_enabled ? 'checked' : ''} style="width:auto">
      Run on this schedule</label>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn primary" onclick="saveSchedule()">Save</button>`);
}

async function saveSchedule() {
  try {
    const r = await api(`/api/investigations/${State.invId}/schedule`, {
      method: 'PUT',
      body: JSON.stringify({
        enabled: $('#schedOn').checked, cron: $('#cron').value.trim(),
        max_items: parseInt($('#maxItems').value), max_rounds: parseInt($('#maxRounds').value),
      }),
    });
    closeModal();
    await loadInvestigations();
    toast(r.enabled ? `Scheduled. Next run ${fmtDate(r.next_run_at)}.` : 'Schedule cleared.', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function showTaxonomyModal() {
  const T = State.taxonomies;
  const bySrc = {};
  T.channels.forEach(c => (bySrc[c.src] ||= []).push(c));
  openModal('Domain taxonomy', `
    <p style="color:var(--text2);font-size:12.5px;margin-bottom:16px;line-height:1.7">
      Ten domains plus the channels between them. A domain is a label; a channel is a
      mechanism with a typical lag. The transmission walk
      (<code>/api/transmission/{id}</code>) is a <em>prior</em> — a run's evidence either
      supports each hop or does not, and the graph only draws an edge when two documents
      actually share an actor.</p>
    <div class="grid c2">
      ${T.domains.map(d => `<div class="domain-card">
        <div class="domain-name"><span class="dot" style="background:${d.color}"></span>
          ${d.label} ${d.hub ? '<span class="tag" style="color:var(--purple)">hub</span>' : ''}</div>
        <div style="font-size:11.5px;color:var(--text2);margin-top:5px;line-height:1.55">${d.blurb}</div>
        <div style="font-size:10.5px;color:var(--text3);margin-top:7px">
          ${d.in_degree} inbound · ${d.out_degree} outbound channels</div>
        ${(bySrc[d.id] || []).slice(0, 5).map(c => `<div style="font-size:11px;margin-top:4px">
          <span style="color:${domColor(c.dst)}">→ ${domLabel(c.dst)}</span>
          <span style="color:var(--text2)"> ${c.channel}</span>
          <span style="color:var(--text3)"> (${c.strength}, ${c.lag}q)</span></div>`).join('')}
      </div>`).join('')}
    </div>
    <h4 style="font-size:12px;color:var(--text3);text-transform:uppercase;
      letter-spacing:.06em;margin:20px 0 9px">Drivers</h4>
    <table class="tbl"><thead><tr><th>Driver</th><th>Domains</th><th>Lag</th><th>Description</th></tr></thead>
      <tbody>${Object.entries(T.drivers).map(([k, v]) => `<tr>
        <td><strong>${v.label}</strong></td>
        <td>${v.domains.map(d => `<span class="dot" style="background:${domColor(d)};margin-right:3px"></span>${domLabel(d)}`).join(' ')}</td>
        <td>${v.typical_lag}q</td><td style="color:var(--text2)">${v.description}</td></tr>`).join('')}
      </tbody></table>`,
    `<button class="btn primary" onclick="closeModal()">Close</button>`);
}

// ==========================================================================
// Header status
// ==========================================================================
async function refreshStatus() {
  try {
    const h = await api('/api/health');
    const llm = h.llm || {};
    const pill = $('#llmPill');
    pill.className = 'pill ' + (llm.reachable ? (llm.fallback_active ? 'warn' : 'ok') : 'err');
    pill.innerHTML = llm.reachable
      ? `<i class="fas fa-microchip"></i> ${llm.model}${llm.fallback_active ? ' (fallback)' : ''}`
      : `<i class="fas fa-plug-circle-xmark"></i> no gateway`;
    pill.title = llm.notice || `Gateway: ${llm.served_by || llm.base_url}`;

    const jobs = h.jobs || {};
    const q = $('#queuePill');
    const active = (jobs.running || 0) + (jobs.queued || 0);
    q.className = 'pill ' + (active ? 'busy' : '');
    q.innerHTML = `<i class="fas fa-list-check"></i> ${active} queued`;
    q.title = JSON.stringify(jobs);
  } catch (e) { $('#llmPill').className = 'pill err'; $('#llmPill').textContent = 'offline'; }
}

async function updateBadges() {
  if (!State.invId) return;
  try {
    const inv = await api('/api/investigations/' + State.invId);
    $('#pendingCount').textContent = inv.counts.pending;
    const invRow = State.investigations.find(i => i.id === State.invId);
    if (invRow) invRow.counts = inv.counts;
    renderSidebar();
  } catch (e) {}
}

// ==========================================================================
// Polling: only while there is work, and only for the view that needs it
// ==========================================================================
function startPolling() {
  if (State.timer) return;
  State.timer = setInterval(async () => {
    refreshStatus();
    if (!State.invId) return;
    try {
      const jobs = await api('/api/jobs');
      const busy = (jobs.counts.running || 0) + (jobs.counts.queued || 0);
      if (!busy) {
        clearInterval(State.timer);
        State.timer = null;
        await loadInvestigations();
        await refreshView();
        updateBadges();
        toast('Work finished.', 'ok');
        return;
      }
      if (State.view === 'console') await loadConsoleLog();
      updateBadges();
    } catch (e) {}
  }, 1800);
}

function openModal(title, body, foot = '') {
  $('#modalTitle').innerHTML = title;
  $('#modalBody').innerHTML = body;
  $('#modalFoot').innerHTML = foot;
  $('#modalBack').classList.add('open');
}
function closeModal() {
  $('#modalBack').classList.remove('open');
  if (State.queueTimer) { clearInterval(State.queueTimer); State.queueTimer = null; }
}

// ---------- queue overlay ----------
async function showQueueModal() {
  openModal('Queue', '<div class="empty">Loading…</div>',
    '<button class="btn primary" onclick="closeModal()">Close</button>');
  await loadQueueModal();
  // Live overlay: refresh twice a second-ish while open so a draining queue
  // is visible without reopening. Stopped by closeModal.
  if (State.queueTimer) clearInterval(State.queueTimer);
  State.queueTimer = setInterval(async () => {
    if (!$('#modalBack').classList.contains('open')) {
      clearInterval(State.queueTimer);
      State.queueTimer = null;
      return;
    }
    await loadQueueModal(true);
  }, 2000);
}

async function loadQueueModal(quiet = false) {
  try {
    const [q, w] = await Promise.all([
      api('/api/jobs'),
      api('/api/jobs/worker').catch(() => null),
    ]);
    const counts = q.counts || {};
    const jobs = q.jobs || [];
    const invName = (id) => {
      const inv = State.investigations.find(i => i.id === id);
      return inv ? esc(inv.title.slice(0, 44)) : 'inv ' + id;
    };
    $('#modalBody').innerHTML = `
      <div class="meta-strip">
        <span class="tag">queued ${counts.queued || 0}</span>
        <span class="tag">running ${counts.running || 0}</span>
        <span class="tag">done ${counts.done || 0}</span>
        <span class="tag">error ${counts.error || 0}</span>
        ${w ? `<span class="tag" style="color:var(--${w.worker_alive ? 'green' : 'red'})">
          worker ${w.worker_alive ? 'alive' : 'DEAD'}</span>` : ''}
      </div>
      ${!w?.worker_alive && w ? `<div class="banner err"><i class="fas fa-triangle-exclamation"></i>
        <span>The worker thread is down with jobs waiting — restart the server.
        Queued work is safe in the database and resumes on startup.</span></div>` : ''}
      ${jobs.length ? jobs.map(j => `
        <div class="source-item" style="margin-bottom:7px">
          <div><strong>#${j.id} ${esc(j.kind)}</strong>
            <span class="tag" style="margin-left:6px;color:var(--${
              j.status === 'error' ? 'red' : j.status === 'running' ? 'accent' : 'text2'})">${esc(j.status)}</span>
            <span style="color:var(--text3);font-size:11px;margin-left:6px">
              ${j.investigation_id ? invName(j.investigation_id) : ''} · attempt ${j.attempts}</span>
            ${j.status === 'queued' ? `<button class="btn sm danger" style="float:right"
              onclick="cancelJob(${j.id})">cancel</button>` : ''}
          </div>
          ${j.error ? `<div style="color:var(--red);font-size:11px;margin-top:5px">${esc(j.error.slice(0, 220))}</div>` : ''}
        </div>`).join('') : '<div class="empty">Queue is empty.</div>'}`;
  } catch (e) {
    if (!quiet) toast(e.message, 'err');
  }
}

async function cancelJob(id) {
  try {
    await api(`/api/jobs/${id}/cancel`, { method: 'POST' });
    toast(`Job #${id} cancelled.`, 'ok');
    await loadQueueModal();
  } catch (e) { toast(e.message, 'err'); }
}

// ==========================================================================
// Boot
// ==========================================================================
$('#themeBtn').onclick = () => {
  document.documentElement.classList.toggle('light');
  localStorage.setItem('econ-theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
  if (State.graph) drawGraph(State.graph);
};
$('#taxBtn').onclick = showTaxonomyModal;
$('#modalBack').onclick = (e) => { if (e.target.id === 'modalBack') closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

(async function boot() {
  try {
    await loadTaxonomies();
    await loadInvestigations();
    await refreshStatus();
    setInterval(refreshStatus, 15000);
    await refreshView();
    await updateBadges();
    // Pick up work that was already queued when the page loaded.
    const jobs = await api('/api/jobs');
    if ((jobs.counts.running || 0) + (jobs.counts.queued || 0)) startPolling();
  } catch (e) {
    // A failed fetch means the API is down; anything else means the API
    // answered and a view failed to render. Blaming the API for a render
    // error sends the operator debugging the wrong half of the system.
    const apiDown = /fetch|network|load failed|http/i.test(e.message || '');
    $('#view').innerHTML = `<div class="banner err"><i class="fas fa-triangle-exclamation"></i>
      <span>Could not start: ${esc(e.message)}. ${
        apiDown ? 'Is the API reachable at this host and port?'
                : 'The API responded — a view failed to render. Open the browser console for the stack.'}</span></div>`;
  }
})();
</script>
</body>
</html>
